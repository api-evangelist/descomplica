name: Descomplica
description: >-
  Descomplica is a Brazilian online education (edtech) company founded in 2011
  and headquartered in Rio de Janeiro, offering a digital learning platform for
  ENEM and vestibular exam prep, K-12 (Escolar), undergraduate and graduate
  (Pós-graduação) degrees, public-exam (Concursos) preparation, and corporate
  training. The platform delivers live and recorded classes, study plans,
  tutoring, exercises, and support materials to millions of Brazilian students,
  and is MEC-authorized. It was added to the API Evangelist network as a
  portfolio company of 500 Global; the company operates consumer and corporate
  learning products but does not publish a public developer API program.
